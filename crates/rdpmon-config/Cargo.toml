[package]
name = "rdpmon-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RDP Monitor configuration utility"

[[bin]]
name = "rdpmon-config"
path = "src/main.rs"

[dependencies]
rdpmon-core.workspace = true
chrono.workspace = true
# Software renderer: works in RDP sessions and on servers without a GPU.
slint = { version = "1.9", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }

[build-dependencies]
slint-build = "1.9"
